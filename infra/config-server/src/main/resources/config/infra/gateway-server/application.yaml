logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty: DEBUG
    org.springframework.web.server: DEBUG
server:
  port: 8080
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      routes:
        - id: user_service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: request_service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**,/users/{userId}/events/{eventId}/requests/**

        - id: category_service
          uri: lb://category-service
          predicates:
            - Path=/categories/**, /admin/categories/**

        - id: event_service
          uri: lb://event-service
          predicates:
            - Path=/**
